# Ground truth is computed from eval/fixtures/clean by truth_sql, then frozen
# into expect_rows. Questions are asked against the CORRUPTED fixtures, so a
# passing answer means the messy-data layer did its job.
# Regenerate with: python eval/make_questions.py

- id: q01
  fixture: sales
  q: What is the total order amount across all orders?
  kind: single-table aggregate
  truth_sql: SELECT round(sum(amount),2) AS total_revenue FROM orders
  expect_rows:
  - - 390157.01
  tolerance: 0.01
- id: q02
  fixture: sales
  q: How many employees work in the Sales department?
  kind: filter + aggregate
  truth_sql: SELECT count(*) AS n FROM employees WHERE department='Sales'
  expect_rows:
  - - 6.0
  tolerance: 0.01
- id: q03
  fixture: sales
  q: What is the total order amount for each customer region?
  kind: cross-file join
  truth_sql: SELECT c.region, round(sum(o.amount),2) AS revenue FROM orders o JOIN customers c ON o.customer_id=c.customer_id
    GROUP BY 1 ORDER BY 1
  expect_rows:
  - - East
    - 98726.54
  - - North
    - 79772.7
  - - South
    - 109376.52
  - - West
    - 102281.25
  tolerance: 0.01
- id: q04
  fixture: sales
  q: What is the average employee salary?
  kind: single-table aggregate
  truth_sql: SELECT round(avg(salary),2) AS avg_salary FROM employees
  expect_rows:
  - - 101733.33
  tolerance: 0.01
- id: q05
  fixture: sales
  q: What is the average salary by department?
  kind: group-by aggregate
  truth_sql: SELECT department, round(avg(salary),2) AS avg_salary FROM employees GROUP BY 1 ORDER BY
    1
  expect_rows:
  - - Engineering
    - 100833.33
  - - Finance
    - 96500.0
  - - Operations
    - 121833.33
  - - People
    - 99166.67
  - - Sales
    - 90333.33
  tolerance: 0.01
- id: q06
  fixture: sales
  q: Which 3 customers have the highest total order amount?
  kind: top-N + join
  truth_sql: SELECT c.customer_name, round(sum(o.amount),2) AS revenue FROM orders o JOIN customers c
    ON o.customer_id=c.customer_id GROUP BY 1 ORDER BY 2 DESC LIMIT 3
  expect_rows:
  - - Park Ltd
    - 71470.42
  - - Park Corp
    - 31544.7
  - - Nair Co
    - 28393.25
  tolerance: 0.01
